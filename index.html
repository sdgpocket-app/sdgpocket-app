<script>
(function(){
  var jsQRUrls = [
    'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js',
    'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',

  function tryLoad(i){
    if(i >= jsQRUrls.length){ console.error('No se pudo cargar el lector de QR desde ninguna fuente.'); return; }

<style>
  :root{
    --ink:#141414; --petrol:#1f4b63; --petrol-light:#2f6a89; --petrol-pale:#e8eef1;
    --paper:#faf9f6; --card:#ffffff; --line:#e4e2dc; --muted:#8a8579;
    --danger:#a3372f; --danger-pale:#f6e6e4; --success:#2f6b4f; --success-pale:#e5efe9;
    --pending:#b8863b; --pending-pale:#f5ecdd; --paused:#6b6459; --paused-pale:#ececea;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  body{padding-bottom:84px;min-height:100vh;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.01em;margin:0;text-transform:uppercase;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .topbar{background:#ffffff;color:var(--ink);padding:calc(16px + env(safe-area-inset-top)) 18px 14px;position:relative;overflow:hidden;border-bottom:3px solid var(--petrol);transition:padding .25s ease;}
  .brand-row{display:flex;align-items:center;justify-content:center;position:relative;z-index:1;transition:all .25s ease;}
  .brand-logo{max-width:210px;width:100%;height:auto;display:block;transition:max-width .25s ease;}
  .topbar .subtitle{display:none;}
  .logout-link{color:var(--petrol);font-size:11px;font-weight:700;text-decoration:underline;background:none;border:none;}

  .topbar.compact{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;}
  .topbar.compact .brand-row{justify-content:flex-start;}
  .topbar.compact .brand-logo{max-width:88px;}
  .topbar.compact .subtitle{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:11px;}

  .gate{min-height:calc(100vh - 130px);display:flex;flex-direction:column;justify-content:center;padding:20px;position:relative;}
  .gate-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--paper);}
  .gate-bg svg{position:absolute;opacity:.07;}
  .gate-bg .d1{width:220px;top:-40px;left:-60px;transform:rotate(12deg);}
  .gate-bg .d2{width:160px;bottom:60px;right:-50px;transform:rotate(-8deg);}
  .gate-bg .d3{width:120px;bottom:-30px;left:20%;transform:rotate(20deg);}

  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:50;}
  .tab-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;
    color:var(--muted);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;padding:4px 3px;letter-spacing:.01em;flex:1;}
  .tab-btn.active{color:var(--petrol);}
  .tab-diamond{width:16px;height:16px;}
  .tab-diamond svg{width:100%;height:100%;}

  .content{padding:16px;max-width:640px;margin:0 auto;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .section-head h2{font-size:20px;}
  .section-underline{height:3px;width:34px;background:var(--petrol);margin-top:5px;margin-bottom:16px;}

  .btn{border:none;border-radius:10px;padding:11px 16px;font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;letter-spacing:.01em;}
  .btn-primary{background:var(--petrol);color:#fff;}
  .btn-primary:active{background:var(--ink);}
  .btn-ghost{background:transparent;color:var(--petrol);border:1.5px solid var(--petrol);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:7px 11px;font-size:12px;border-radius:8px;}
  .btn-block{width:100%;}
  .fab{position:fixed;right:18px;bottom:96px;width:52px;height:52px;border-radius:50%;background:var(--petrol);
    color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(20,20,20,.25);z-index:40;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .stat-num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .stat-card.alert .stat-num{color:var(--danger);}
  .stat-card.ok .stat-num{color:var(--success);}

  .student-row{display:flex;align-items:center;gap:12px;}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--petrol-pale);color:var(--petrol);
    display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:15px;
    overflow:hidden;flex-shrink:0;border:2px solid var(--petrol);}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .s-name{font-weight:700;font-size:14.5px;}
  .s-meta{font-size:12px;color:var(--muted);margin-top:1px;}
  .belt-pill{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    padding:2px 8px;border-radius:20px;background:var(--petrol-pale);color:var(--petrol);margin-top:3px;}
  .status-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .status-pagado{background:var(--success-pale);color:var(--success);}
  .status-pendiente{background:var(--pending-pale);color:var(--pending);}
  .status-pausado{background:var(--paused-pale);color:var(--paused);}
  .status-moroso{background:var(--danger-pale);color:var(--danger);}
  .status-exento{background:var(--petrol-pale);color:var(--petrol);}

  .search-box{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:'Inter';font-size:14px;margin-bottom:14px;background:#fff;}
  .search-box:focus{outline:none;border-color:var(--petrol);}

  .empty{text-align:center;padding:40px 16px;color:var(--muted);}
  .empty svg{width:44px;height:44px;opacity:.35;margin-bottom:10px;}
  .empty p{font-size:13px;margin:4px 0 0;}

  .overlay{position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:100;display:flex;align-items:flex-end;}
  .sheet{background:#fff;width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h3{font-size:17px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;padding:4px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);font-family:'Inter';font-size:14.5px;background:#fff;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--petrol);}
  .photo-picker{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .photo-picker .avatar{width:60px;height:60px;font-size:20px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month-nav button{background:var(--petrol-pale);color:var(--petrol);border:none;border-radius:8px;width:32px;height:32px;font-size:16px;font-weight:700;}
  .month-label{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;text-transform:capitalize;}

  .qr-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px;}
  .qr-frame{padding:14px;background:#fff;border:2px solid var(--ink);border-radius:12px;position:relative;}
  .qr-frame::before, .qr-frame::after{content:'';position:absolute;width:9px;height:9px;background:var(--petrol);transform:rotate(45deg);}
  .qr-frame::before{top:-5px;left:-5px;} .qr-frame::after{bottom:-5px;right:-5px;}

  .scan-wrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:340px;margin:0 auto;}
  .scan-wrap video{width:100%;height:100%;object-fit:cover;}
  .scan-frame{position:absolute;inset:14%;border:3px solid var(--petrol-light);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);}
  .scan-msg{text-align:center;color:var(--muted);font-size:12.5px;margin-top:10px;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;
    border-radius:30px;font-size:13px;font-weight:600;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .toast.err{background:var(--danger);}
  .toast .dot{width:7px;height:7px;background:var(--petrol-light);border-radius:50%;flex-shrink:0;}

  .lead-status{display:flex;gap:6px;margin-top:8px;}
  .lead-status button{flex:1;font-size:10.5px;padding:6px 4px;border-radius:7px;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:700;text-transform:uppercase;}
  .lead-status button.active{border-color:var(--petrol);background:var(--petrol-pale);color:var(--petrol);}

  .tabs-scan-toggle{display:flex;background:var(--petrol-pale);border-radius:10px;padding:3px;margin-bottom:16px;}
  .tabs-scan-toggle button{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--petrol);}
  .tabs-scan-toggle button.active{background:var(--petrol);color:#fff;}

  .att-history-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .att-history-item:last-child{border-bottom:none;}

  /* ---- Racha de asistencia ---- */
  .streak-card{background:linear-gradient(135deg,var(--ink),#26313a);border-radius:18px;padding:20px;margin-bottom:12px;text-align:center;color:#fff;position:relative;overflow:hidden;}
  .streak-flame{font-size:38px;line-height:1;display:block;margin-bottom:2px;}
  .streak-num{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;line-height:1;}
  .streak-label{font-size:11.5px;color:#c9c6bd;text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
  .week-strip{display:flex;gap:6px;justify-content:space-between;margin-top:16px;}
  .week-cell{flex:1;text-align:center;}
  .week-cell .wd{font-size:9.5px;color:#c9c6bd;text-transform:uppercase;margin-bottom:5px;font-weight:700;}
  .week-cell .box{width:100%;aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;border:1.5px solid rgba(255,255,255,.15);}
  .week-cell.attended .box{background:var(--petrol-light);border-color:var(--petrol-light);}
  .week-cell.rest .box{background:rgba(255,255,255,.08);}
  .week-cell.missed .box{background:transparent;}
  .week-cell.future .box{background:transparent;border-style:dashed;opacity:.4;}
  .week-cell.pending .box{background:transparent;border-color:rgba(255,255,255,.35);}
  .restday-row{display:flex;gap:6px;margin-top:14px;}
  .restday-btn{flex:1;padding:7px 0;border-radius:8px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:#c9c6bd;font-size:10.5px;font-weight:700;}
  .restday-btn.active{background:var(--petrol-light);border-color:var(--petrol-light);color:#fff;}
  .restday-hint{font-size:10.5px;color:#8f8c84;margin-top:8px;}
  .badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;}
  .badge .bi{font-size:26px;line-height:1;margin-bottom:6px;filter:grayscale(1);opacity:.3;}
  .badge.unlocked .bi{filter:none;opacity:1;}
  .badge .bl{font-size:10px;font-weight:700;color:var(--muted);line-height:1.2;}
  .badge.unlocked .bl{color:var(--ink);}
  .chart-toggle-3{display:flex;background:var(--petrol-pale);border-radius:10px;padding:3px;}
  .chart-toggle-3 button{flex:1;border:none;background:none;padding:7px 4px;border-radius:7px;font-weight:700;font-size:11px;color:var(--petrol);}
  .chart-toggle-3 button.active{background:var(--petrol);color:#fff;}

  /* ---- Auth / gate screens ---- */
  .gate-title{text-align:center;margin-bottom:26px;}
  .hero-logo{text-align:center;margin-bottom:6px;}
  .hero-logo img{max-width:180px;width:70%;height:auto;filter:drop-shadow(0 8px 20px rgba(31,75,99,.18));}
  .gate-title .kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
  .role-card{display:flex;align-items:center;gap:14px;padding:20px;border:1.5px solid var(--line);border-radius:18px;background:#fff;margin-bottom:14px;text-align:left;width:100%;box-shadow:0 4px 14px rgba(20,20,20,.06);transition:transform .15s ease;}
  .role-card:active{transform:scale(.97);}
  .role-card .ic{width:46px;height:46px;border-radius:13px;background:var(--petrol-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .role-card .ic svg{width:22px;height:22px;}
  .role-card b{display:block;font-size:15px;}
  .role-card span{font-size:12px;color:var(--muted);}
  .pin-dots{display:flex;gap:18px;justify-content:center;margin:22px 0;}
  .pin-dots .d{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--petrol);}
  .pin-dots .d.filled{background:var(--petrol);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:300px;margin:0 auto;}
  .keypad button{padding:22px 0;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:28px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .keypad button:active{background:var(--petrol-pale);}
  .back-link{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:14px;text-decoration:underline;}
  .post-card{border-left:4px solid var(--petrol);}
  .post-type{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--petrol);}
  .reaction-row{display:flex;gap:14px;margin-top:10px;}
  .reaction-count{font-size:12px;color:var(--muted);font-weight:600;}
</style>
</head>

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}
async function activarNotificaciones(ownerType, ownerId){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('Tu navegador no soporta notificaciones push. En iPhone/iPad, agrega la app a tu pantalla de inicio primero.', true);
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission!=='granted'){ showToast('No diste permiso para recibir notificaciones', true); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').insert({
      owner_type: ownerType, owner_id: ownerId,
      endpoint: subJson.endpoint, p256dh: subJson.keys.p256dh, auth_key: subJson.keys.auth
    });

  }catch(e){ console.error(e); showToast('No se pudieron activar las notificaciones', true); }
}

const DAY_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
/* IMPORTANTE: nunca calcular "la fecha de hoy" convirtiendo a texto ISO en UTC —
   eso da la fecha en Greenwich, no en la hora local de México, y por la tarde/noche ya
   marca el día siguiente por error. Esta función sí usa la fecha local del dispositivo. */
function todayLocalStr(d){
  const dt = d || new Date();
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

/* Guardado seguro: SIEMPRE relee la versión más reciente de la base de datos antes de
   modificar y guardar, en vez de confiar en lo que ya está en pantalla (state.xxx).
   Esto evita que una pantalla desactualizada sobrescriba y borre datos guardados por
   otro dispositivo o en otro momento. */
/* Guardado seguro: SIEMPRE relee la versión más reciente de la base de datos antes de
   modificar y guardar, en vez de confiar en lo que ya está en pantalla (state.xxx).
   Esto evita que una pantalla desactualizada sobrescriba y borre datos guardados por
   otro dispositivo o en otro momento. Devuelve null si el guardado falló, para que
   quien llama a esta función NUNCA muestre "éxito" si en realidad no se guardó nada. */
async function saveListSafely(key, mutateFn){
  const fresh = (await safeGet(key)) || [];
  mutateFn(fresh);
  const ok = await saveKey(key, fresh);
  if(!ok) return null;
  state[key] = fresh;
  return fresh;
}
async function safeGet(key){
  try{
    const { data, error } = await sb.from(tableFor(key)).select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : [];
  }catch(e){ console.error('Error leyendo '+key, e); return []; }
}
async function safeGetObj(key){
  try{
    const { data, error } = await sb.from(tableFor(key)).select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : null;
  }catch(e){ console.error('Error leyendo '+key, e); return null; }
}
async function saveKey(key, value){
  try{
    const { error } = await sb.from(tableFor(key)).upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) throw error;
    return true;
  }catch(e){ console.error('Error guardando '+key,e); showToast('No se pudo guardar: '+(e.message||'error desconocido'), true); return false; }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* Limpia cualquier caracter no numérico (ej. "$", comas, espacios) antes de convertir a número,
   para que un monto como "$500" no se guarde como NaN y rompa las sumas de Finanzas/Inicio. */
function sanitizeAmount(str){
  if(str===null || str===undefined) return '';
  const cleaned = String(str).replace(/[^0-9.]/g,'');
  return cleaned;
}
async function hashPin(pin){
  const enc = new TextEncoder().encode(String(pin));
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function handleRegPhoto(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload=(e)=>{
    const img = new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas'); const size=220;
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      const scale=Math.max(size/img.width, size/img.height);
      const w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      window._regPhoto = canvas.toDataURL('image/jpeg',0.82);
      document.getElementById('regPhotoPreview').innerHTML = `<img src="${window._regPhoto}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  if(!name){ showToast('Escribe tu nombre', true); return; }
  state.pendingProfile = {
    id: uid(), name,
    phone: document.getElementById('reg_phone').value.trim(),
    belt: document.getElementById('reg_belt').value,
    joinDate: todayLocalStr(),
    photo: window._regPhoto || '',
    birthDate: document.getElementById('reg_birth').value,
    weight: document.getElementById('reg_weight').value,
    titles: document.getElementById('reg_titles').value.trim(),
    membershipType:'regular', membershipNote:'',
    role:'student', _isNew:true
  };
  state.pinBuffer='';
  state.auth='studentPin';
  render();
}
function renderPinDots(n){
  let out='';
  for(let i=0;i<n;i++) out += `<div class="d ${i<state.pinBuffer.length?'filled':''}"></div>`;
  return out;
}
function renderKeypad(handler){
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  return `<div class="keypad">${keys.map(k=>{
    if(k==='') return '<div></div>';
    if(k==='⌫') return `<button onclick="pinBackspace('${handler}')">⌫</button>`;
    return `<button onclick="pinPress('${k}','${handler}')">${k}</button>`;
  }).join('')}</div>`;
}
function pinPress(k, handler){
  if(state.pinBuffer.length>=4) return;
  state.pinBuffer += k;
  document.querySelector('.pin-dots').innerHTML = renderPinDots(4);
  if(state.pinBuffer.length===4) window[handler]();
}
function pinBackspace(handler){
  state.pinBuffer = state.pinBuffer.slice(0,-1);
  document.querySelector('.pin-dots').innerHTML = renderPinDots(4);
}
async function checkAdminLogin(){
  const email = document.getElementById('admin_email').value.trim();
  const password = document.getElementById('admin_password').value;
  const errBox = document.getElementById('adminLoginError');
  errBox.textContent = '';
  if(!email || !password){ errBox.textContent = 'Escribe correo y contraseña.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    errBox.textContent = 'Correo o contraseña incorrectos.';
    return;
  }
  await reloadPrivateData();
  state.auth='admin'; state.tab='inicio';
  render();
}
async function checkStudentPin(){
  const p = state.pendingProfile;
  if(p._isNew){
    p.pinHash = await hashPin(state.pinBuffer);
    delete p._isNew;
    const result = await saveListSafely('students', arr=>arr.push(p));
    if(!result) return;
    state.currentProfile = p;
    state.auth='student'; state.tab='perfil'; state.pinBuffer='';
    render();
    showToast('¡Bienvenido, '+p.name+'!');
    await loadMiSuscripcion(); render();
  } else {
    const h = await hashPin(state.pinBuffer);
    if(h === p.pinHash){
      state.currentProfile = state.students.find(x=>x.id===p.id);
      state.auth='student'; state.tab='perfil'; state.pinBuffer='';
      render();
      await loadMiSuscripcion(); render();
    } else {
      showToast('PIN incorrecto', true);
      setTimeout(()=>{ state.pinBuffer=''; render(); }, 500);
    }
  }
}

/* ============ HELPERS ============ */
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayKey(){ return monthKey(new Date()); }
function fmtMonth(d){ return d.toLocaleDateString('es-MX',{month:'long',year:'numeric'}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }
function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function paymentStatusFor(studentId,mKey){ const p=state.payments.find(x=>x.studentId===studentId && x.month===mKey); return p?p.status:null; }
function isExempt(student){ return student.membershipType==='becado' || student.membershipType==='instructor'; }
function computeLiveStatus(student){
  if(isExempt(student)) return 'exento';
  const mKey=todayKey(); const p=paymentStatusFor(student.id,mKey);
  if(p==='pausado') return 'pausado';
  if(p==='pagado') return 'pagado';
  const day=new Date().getDate();
  if(p==='pendiente' && day<=GRACE_DAYS) return 'pendiente';
  if(!p && day<=GRACE_DAYS) return 'pendiente';
  return 'moroso';
}
function statusLabel(s){ return {pagado:'Pagado',pendiente:'Pendiente',pausado:'Pausado',moroso:'Moroso',exento:'Sin costo'}[s]||s; }
function membershipLabel(t){ return {regular:'Regular',promocion:'Promoción',becado:'Becado',instructor:'Instructor'}[t]||'Regular'; }
function ageFromDOB(dob){
  if(!dob) return null;
  const b=new Date(dob+'T00:00:00'); const now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  const m=now.getMonth()-b.getMonth();
  if(m<0 || (m===0 && now.getDate()<b.getDate())) age--;
  return age;
}

/* ---- Series mensuales para gráficas ---- */
function lastMonths(n){
  const out=[];
  const now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push({key:monthKey(d), label:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')});
  }
  return out;
}
function attendanceByMonth(studentId, n){
  const months=lastMonths(n);
  const mine = studentId ? state.attendance.filter(a=>a.studentId===studentId) : state.attendance;
  return { labels:months.map(m=>m.label), data:months.map(m=>mine.filter(a=>a.date.startsWith(m.key)).length) };
}
function attendanceByDayThisMonth(studentId){
  const now=new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const mKey = monthKey(now);
  const mine = state.attendance.filter(a=>a.studentId===studentId && a.date.startsWith(mKey));
  const labels=[], data=[];
  for(let d=1; d<=daysInMonth; d++){
    const key = mKey+'-'+String(d).padStart(2,'0');
    labels.push(String(d));
    data.push(mine.filter(a=>a.date===key).length);
  }
  return { labels, data };
}
function computeStreak(studentId, restDay){
  const mine = new Set(state.attendance.filter(a=>a.studentId===studentId).map(a=>a.date));
  let streak=0, cursor=new Date(); cursor.setHours(0,0,0,0);
  let first=true, guard=0;
  while(guard++<730){
    const key=todayLocalStr(cursor);
    const dow=cursor.getDay();
    const attended=mine.has(key);
    if(first && !attended){ first=false; cursor.setDate(cursor.getDate()-1); continue; }
    first=false;
    if(attended || dow===restDay){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}
function currentWeekStatus(studentId, restDay){
  const mineDates = state.attendance.filter(a=>a.studentId===studentId).map(a=>a.date);
  const counts = {};
  mineDates.forEach(d=>{ counts[d]=(counts[d]||0)+1; });
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay(); // 0=domingo
  const monday = new Date(today); monday.setDate(today.getDate() - ((dow+6)%7));
  const names=['D','L','M','M','J','V','S'];
  const cells=[];
  let weekCount=0;
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    const key=todayLocalStr(d);
    const isToday = key===todayLocalStr(today);
    const isFuture = d>today;
    const n = counts[key]||0;
    let status;
    if(n>0){ status='attended'; weekCount++; }
    else if(d.getDay()===restDay){ status='rest'; }
    else if(isFuture){ status='future'; }
    else if(isToday){ status='pending'; }
    else { status='missed'; }
    cells.push({label:names[d.getDay()], status, count:n});
  }
  return { cells, weekCount };
}
function maxSessionsInADay(studentId){
  const counts={};
  state.attendance.filter(a=>a.studentId===studentId).forEach(a=>{ counts[a.date]=(counts[a.date]||0)+1; });
  const vals = Object.values(counts);
  return vals.length ? Math.max(...vals) : 0;
}

const chartRegistry = {};
function drawBarChart(canvasId, labels, data, color){
  const el = document.getElementById(canvasId);
  if(!el) return;
  if(chartRegistry[canvasId]){ chartRegistry[canvasId].destroy(); }
  chartRegistry[canvasId] = new Chart(el, {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor: color||'#1f4b63', borderRadius:5, maxBarThickness:34 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{padding:8, cornerRadius:8} },
      scales:{ y:{ beginAtZero:true, ticks:{precision:0, color:'#8a8579', font:{size:10}}, grid:{color:'#e4e2dc'} },

function handlePhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas'); const size=220;
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      const scale=Math.max(size/img.width,size/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      window._photoData=canvas.toDataURL('image/jpeg',0.82);
      document.getElementById('photoPreview').innerHTML=`<img src="${window._photoData}">`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
async function saveStudent(id, isNew){
  const name=document.getElementById('f_name').value.trim();

  const pin = document.getElementById('f_pin').value.trim();
  const existing = state.students.find(s=>s.id===id);
  const pinHash = pin ? await hashPin(pin) : (existing?existing.pinHash:null) || await hashPin('0000');
  const data = {
    id, name,
    phone:document.getElementById('f_phone').value.trim(),
    email:document.getElementById('f_email').value.trim(),

async function deleteStudent(id){
  if(!confirm('Esto borra al alumno y todo su historial de forma permanente, sin poder recuperarlo. ¿Continuar?')) return;
  const results = await Promise.all([
    saveListSafely('students', arr=>{ const idx=arr.findIndex(s=>s.id===id); if(idx>=0) arr.splice(idx,1); }),
    saveListSafely('payments', arr=>{ for(let i=arr.length-1;i>=0;i--){ if(arr[i].studentId===id) arr.splice(i,1); } }),
    saveListSafely('attendance', arr=>{ for(let i=arr.length-1;i>=0;i--){ if(arr[i].studentId===id) arr.splice(i,1); } })
  ]);
  if(results.some(r=>!r)) return;

async function approveComprobante(id, studentId, month){
  const amount = sanitizeAmount(prompt('Monto pagado (MXN):',''));
  if(amount===null) return;
  const result = await saveListSafely('payments', arr=>{
    let p = arr.find(x=>x.studentId===studentId && x.month===month);
    if(!p){ p={id:uid(), studentId, month}; arr.push(p); }
    p.status='pagado'; p.amount = amount!=='' ? Number(amount) : (p.amount||0);
    p.paidDate = todayLocalStr();
  });
  if(!result) return;
  const { error } = await sb.from('comprobantes').update({status:'aprobado'}).eq('id', id);
  if(error){ showToast('Pago guardado, pero no se pudo actualizar el comprobante: '+error.message, true); }
  await loadComprobantes(); render(); showToast('Comprobante aprobado y pago registrado');
}
async function rejectComprobante(id){
  const note = prompt('¿Por qué se rechaza? (opcional, se puede dejar en blanco)','');
  if(note===null) return;
  const { error } = await sb.from('comprobantes').update({status:'rechazado', note}).eq('id', id);
  if(error){ showToast('No se pudo rechazar: '+error.message, true); return; }
  await loadComprobantes(); render(); showToast('Comprobante rechazado');
}
async function setPayment(studentId,mKey,status){
  const current = state.payments.find(x=>x.studentId===studentId && x.month===mKey);
  if(current && current.status==='pagado' && status!=='pagado'){
    if(!confirm('Este pago ya está marcado como "pagado". ¿Seguro que quieres cambiarlo?')) return;
  }
  let amount='';
  if(status==='pagado'){ amount=prompt('Monto pagado (MXN):',''); if(amount===null) return; amount=sanitizeAmount(amount); }
  const result = await saveListSafely('payments', arr=>{
    let p=arr.find(x=>x.studentId===studentId && x.month===mKey);
    if(!p){ p={id:uid(), studentId, month:mKey}; arr.push(p); }
    p.status=status; p.amount = amount!=='' ? Number(amount) : (p.amount||0);
    p.paidDate = status==='pagado' ? todayLocalStr() : p.paidDate;
  });
  if(!result) return;
  render(); showToast('Pago actualizado');
}

const MAX_SESSIONS_PER_DAY = 3;
function renderManualAttendance(){
  const area=document.getElementById('attArea');
  const todayStr=todayLocalStr();
  const todayRecords = state.attendance.filter(a=>a.date===todayStr);
  const todayClasses = SCHEDULE_BY_DAY[todayDayName()] || [];
  if(!state.attendanceClass){ area.innerHTML = emptyBlock('Sin clase seleccionada','Elige la clase de hoy arriba para poder registrar asistencia'); return; }
  area.innerHTML = activeStudents().length===0?emptyBlock('Sin alumnos','Agrega alumnos primero'):activeStudents().map(s=>{
    const forStudent = todayRecords.filter(a=>a.studentId===s.id);
    const alreadyThisClass = forStudent.some(a=>a.className===state.attendanceClass);
    const n = forStudent.length;
    const full = n>=MAX_SESSIONS_PER_DAY;
    const attendedLabels = forStudent.map(a=>a.className).filter(Boolean);
    return `
    <div class="card"><div class="student-row">
      <div class="avatar">${s.photo?`<img src="${s.photo}">`:initials(s.name)}</div>
      <div style="flex:1;"><div class="s-name">${s.name}</div><div class="s-meta">${attendedLabels.length===0?'Sin registrar hoy':'Hoy: '+attendedLabels.join(', ')}</div></div>
      <button class="btn btn-sm ${alreadyThisClass?'btn-primary':'btn-ghost'}" ${(alreadyThisClass||full)?'disabled':''} onclick="markAttendance('${s.id}')">${alreadyThisClass?'✓ Ya en esta clase':(full?'Máximo del día':'Marcar')}</button>
    </div></div>`;
  }).join('');
}
async function markAttendance(studentId){
  if(!state.attendanceClass){ showToast('Selecciona la clase de hoy primero', true); return; }
  const todayStr=todayLocalStr();
  const forStudent = state.attendance.filter(a=>a.studentId===studentId && a.date===todayStr);
  if(forStudent.some(a=>a.className===state.attendanceClass)){ showToast('Ya está registrado en esta clase hoy'); return; }
  if(forStudent.length>=MAX_SESSIONS_PER_DAY){ showToast('Ya alcanzó el máximo de '+MAX_SESSIONS_PER_DAY+' clases hoy'); return; }
  const result = await saveListSafely('attendance', arr=>arr.push({id:uid(), studentId, date:todayStr, className:state.attendanceClass}));
  if(!result) return;
  const s=state.students.find(x=>x.id===studentId);
  showToast((s?s.name:'Alumno')+' registrado en '+state.attendanceClass+' ✓'); render();
}
function renderScanArea(){
  const area=document.getElementById('attArea');
  area.innerHTML=`<div class="scan-wrap"><video id="scanVideo" playsinline muted autoplay></video><div class="scan-frame"></div></div>
    <div class="scan-msg" id="scanMsg">Apunta la cámara al código QR del alumno</div><canvas id="scanCanvas" style="display:none;"></canvas>`;
  waitForJsQR(0);
}
function waitForJsQR(attempt){
  if(typeof jsQR!=='undefined'){ startScan(); return; }
  if(attempt>=6){
    const msg=document.getElementById('scanMsg');
    if(msg) msg.textContent='No se pudo cargar el lector de códigos QR (revisa tu conexión a internet y recarga la página). Usa el modo manual mientras tanto.';
    return;
  }
  setTimeout(()=>waitForJsQR(attempt+1), 500);
}
async function startScan(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    state.scanStream=stream;
    const video=document.getElementById('scanVideo'); if(!video) return;
    video.srcObject=stream; await video.play(); scanLoop();
  }catch(e){ const msg=document.getElementById('scanMsg'); if(msg) msg.textContent='No se pudo acceder a la cámara. Usa el modo manual.'; }
}
function scanLoop(){
  if(!state.scanMode) return;
  const video=document.getElementById('scanVideo'); const canvas=document.getElementById('scanCanvas');
  if(!video||!canvas||video.readyState!==video.HAVE_ENOUGH_DATA){ requestAnimationFrame(scanLoop); return; }
  try{
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    const ctx=canvas.getContext('2d'); ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
    const code=jsQR(imageData.data, imageData.width, imageData.height);
    if(code && code.data && code.data.startsWith('LSDG-')){ handleScanHit(code.data.replace('LSDG-','')); return; }
    if(code && code.data){ showToast('Código QR no reconocido por la app', true); }
  }catch(e){
    console.error('Error leyendo QR', e);
    const msg=document.getElementById('scanMsg');
    if(msg) msg.textContent='Hubo un error leyendo el código. Usa el modo manual mientras tanto.';
    return;
  }
  requestAnimationFrame(scanLoop);
}
async function handleScanHit(studentId){
  const s=state.students.find(x=>x.id===studentId);
  const todayStr=todayLocalStr();
  if(!s){ showToast('Código no reconocido', true); setTimeout(()=>requestAnimationFrame(scanLoop),900); return; }
  if(!state.attendanceClass){ showToast('Selecciona la clase de hoy primero', true); setTimeout(()=>{ if(state.scanMode) requestAnimationFrame(scanLoop); }, 1200); return; }
  const forStudent = state.attendance.filter(a=>a.studentId===studentId && a.date===todayStr);
  if(forStudent.some(a=>a.className===state.attendanceClass)){
    showToast(s.name+' ya está registrado en esta clase');
  } else if(forStudent.length>=MAX_SESSIONS_PER_DAY){
    showToast(s.name+' ya alcanzó el máximo de '+MAX_SESSIONS_PER_DAY+' clases hoy');
  } else{
    const result = await saveListSafely('attendance', arr=>arr.push({id:uid(), studentId, date:todayStr, className:state.attendanceClass}));
    if(result) showToast(s.name+' registrado en '+state.attendanceClass+' ✓');
  }
  setTimeout(()=>{ if(state.scanMode) requestAnimationFrame(scanLoop); }, 1200);
}
function stopScan(){ if(state.scanStream){ state.scanStream.getTracks().forEach(t=>t.stop()); state.scanStream=null; } }

function handlePostPhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=640;
      const scale=Math.min(1, maxW/img.width);
      const w=img.width*scale, h=img.height*scale;
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);

      document.getElementById('postPhotoPreview').innerHTML=`<img src="${window._postPhoto}" style="width:100%;height:100%;object-fit:cover;">`;

  };

async function loadMiSuscripcion(){
  if(!state.currentProfile) return;
  try{
    const { data, error } = await sb.from('suscripciones')
      .select('*').eq('student_id', state.currentProfile.id)
      .order('created_at', {ascending:false}).limit(1);
    if(error) throw error;
    state.miSuscripcion = (data && data[0]) || null;
  }catch(e){ console.error(e); state.miSuscripcion = null; }
}
function renderDomiciliacionEstado(s){
  const sub = state.miSuscripcion;
  const isActive = sub && (sub.status==='authorized' || (sub.status||'').startsWith('pago_approved'));
  const isPending = sub && sub.status==='pending';
  if(isActive){
    return `<div class="s-meta" style="color:var(--primary);font-weight:600;margin-bottom:4px;">✓ Domiciliación activa</div>
      <div class="s-meta">Se te cobra automáticamente cada mes. Ya no necesitas subir comprobante.</div>`;
  }
  if(isPending){
    return `<div class="s-meta" style="margin-bottom:10px;">Tienes una solicitud pendiente de autorizar.</div>
      <button class="btn btn-primary btn-block" style="margin-bottom:8px;" onclick="window.open('${sub.init_point}','_blank')">Continuar autorización</button>
      <button class="btn btn-ghost btn-sm btn-block" onclick="domiciliarPago()">Solicitar una nueva domiciliación</button>`;
  }
  return `<div class="s-meta" style="margin-bottom:10px;">Autoriza el cobro automático mensual y olvídate de subir comprobantes cada mes.</div>
    <button class="btn btn-primary btn-block" onclick="domiciliarPago()">Domiciliar mi pago</button>`;
}
async function domiciliarPago(){
  const s = state.students.find(x=>x.id===state.currentProfile.id) || state.currentProfile;
  if(!s.email){
    showToast('Primero agrega tu correo en "Editar mis datos"', true);
    return;
  }
  if(!s.membershipFee){
    showToast('Tu cuota mensual todavía no está configurada. Pídele al admin que la agregue en tu perfil.', true);
    return;
  }
  showToast('Preparando tu domiciliación...');
  const { data, error } = await sb.functions.invoke('crear-suscripcion', {
    body: { studentId: s.id, studentName: s.name, studentEmail: s.email, amount: s.membershipFee }
  });
  if(error){
    let detail = error.message || 'Error desconocido';
    try{ if(error.context && error.context.json){ const body = await error.context.json(); detail = body.error ? (body.error+(body.detail?': '+JSON.stringify(body.detail):'')) : JSON.stringify(body); } }catch(e){}
    showToast('No se pudo crear la domiciliación: '+detail, true);
    return;
  }
  if(data && data.error){ showToast('Mercado Pago rechazó la solicitud: '+(data.error)+(data.detail?': '+JSON.stringify(data.detail):''), true); return; }
  await loadMiSuscripcion();
  render();
  if(data && data.init_point){ window.open(data.init_point, '_blank'); }
}

function handleMyPhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas'); const size=220;
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext('2d');
      const scale=Math.max(size/img.width,size/img.height);
      const w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      window._myPhoto=canvas.toDataURL('image/jpeg',0.82);
      document.getElementById('myPhotoPreview').innerHTML=`<img src="${window._myPhoto}">`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function retosStats(){
  const wins={}, fights={};
  (state.retos||[]).filter(r=>r.status==='completado' && r.final_winner_id).forEach(r=>{
    wins[r.final_winner_id]=(wins[r.final_winner_id]||0)+1;
    fights[r.challenger_id]=(fights[r.challenger_id]||0)+1;
    if(r.opponent_id) fights[r.opponent_id]=(fights[r.opponent_id]||0)+1;
  });
  return {wins, fights};
}
function retosBadgesFor(studentId){
  const {wins, fights} = retosStats();

  if((fights[studentId]||0)>=1) b.push('🥋 Primer reto');
  if((fights[studentId]||0)>=5) b.push('⚔️ Guerrero (5 peleas)');
  if((wins[studentId]||0)>=5) b.push('🏆 Campeón (5 victorias)');

}

function renderMisRetos(){
  const area=document.getElementById('retosArea');
  const myId = state.currentProfile.id;
  const mine = (state.retos||[]).filter(r=>r.challenger_id===myId || r.opponent_id===myId)
    .slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  if(mine.length===0){ area.innerHTML = emptyBlock('Aún no tienes retos','Lanza un reto con el botón de arriba'); return; }
  area.innerHTML = mine.map(r=>{
    const otherId = r.challenger_id===myId ? r.opponent_id : r.challenger_id;
    const other = otherId ? state.students.find(x=>x.id===otherId) : null;
    const iAmChallenger = r.challenger_id===myId;
    let body='';
    if(r.status==='pendiente' && !iAmChallenger){
      body = `<div class="s-meta" style="margin-bottom:8px;">${slotLabel(r.time_slot)}</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm btn-primary" style="flex:1;" onclick="aceptarRetoEspecifico('${r.id}')">Aceptar</button>
          <button class="btn btn-sm btn-ghost" style="flex:1;" onclick="rechazarReto('${r.id}')">Rechazar</button>
        </div>`;
    } else if(r.status==='pendiente' && iAmChallenger){
      body = `<div class="s-meta" style="margin-bottom:8px;">${slotLabel(r.time_slot)} · Esperando respuesta</div>
        <button class="btn btn-ghost btn-sm btn-block" onclick="cancelarReto('${r.id}')">Cancelar reto</button>`;
    } else if(r.status==='abierto'){
      body = `<div class="s-meta" style="margin-bottom:8px;">${slotLabel(r.time_slot)} · Reto abierto, esperando que alguien lo tome</div>
        <button class="btn btn-ghost btn-sm btn-block" onclick="cancelarReto('${r.id}')">Cancelar reto</button>`;
    } else if(r.status==='aceptado'){
      body = `<div class="s-meta" style="margin-bottom:8px;">${slotLabel(r.time_slot)} · Programado</div>
        <button class="btn btn-primary btn-sm btn-block" onclick="openReportarResultado('${r.id}')">Reportar resultado</button>`;
    } else if(r.status==='por_confirmar'){
      if(r.reported_by===myId){
        body = `<div class="s-meta">Reportaste que ganó ${r.reported_winner_id===myId?'tú':(other?other.name:'tu rival')}. Esperando que ${other?other.name:'tu rival'} confirme.</div>`;
      } else {
        const whoWon = r.reported_winner_id===myId ? 'tú' : (other?other.name:'tu rival');
        body = `<div class="s-meta" style="margin-bottom:8px;">${other?other.name:'Tu rival'} reportó que ganó ${whoWon}. ¿Confirmas?</div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm btn-primary" style="flex:1;" onclick="reportarResultado('${r.id}','${r.reported_winner_id}')">Confirmar</button>
            <button class="btn btn-sm btn-ghost" style="flex:1;" onclick="reportarResultado('${r.id}','${r.reported_winner_id===myId?otherId:myId}')">No es correcto</button>
          </div>`;
      }
    } else if(r.status==='en_disputa'){
      body = `<div class="s-meta">Los resultados no coincidieron — un administrador va a revisarlo y resolverlo.</div>`;
    } else if(r.status==='completado'){
      const won = r.final_winner_id===myId;
      body = `<div class="s-meta">${won?'🏆 Ganaste este reto':'Resultado: ganó '+(other && r.final_winner_id===otherId ? other.name : 'tu rival')}</div>`;
    } else if(r.status==='rechazado'){
      body = `<div class="s-meta">Reto rechazado</div>`;
    } else if(r.status==='cancelado'){
      body = `<div class="s-meta">Reto cancelado</div>`;
    }
    return `<div class="card">
      <div class="s-name">${other ? 'vs. '+other.name : (r.status==='abierto'?'Reto abierto':'Esperando rival')}</div>
      ${body}
    </div>`;
  }).join('');
}

  const r = state.retos.find(x=>x.id===id); if(!r) return;
  const myId = state.currentProfile.id;
  const otherId = r.challenger_id===myId ? r.opponent_id : r.challenger_id;
  const other = state.students.find(x=>x.id===otherId);
  const modal=document.createElement('div'); modal.className='overlay';
  modal.innerHTML=`<div class="sheet">
    <div class="sheet-head"><h3>¿Quién ganó?</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <button class="btn btn-primary btn-block" style="margin-bottom:8px;" onclick="reportarResultado('${id}','${myId}')">Yo gané</button>
    <button class="btn btn-ghost btn-block" onclick="reportarResultado('${id}','${otherId}')">Ganó ${other?other.name:'mi rival'}</button>
  </div>`;
  document.body.appendChild(modal);
}
async function reportarResultado(id, winnerId){
  const r = state.retos.find(x=>x.id===id); if(!r) return;
  const myId = state.currentProfile.id;
  closeModal();
  if(!r.reported_winner_id){
    const { error } = await sb.from('retos').update({status:'por_confirmar', reported_winner_id: winnerId, reported_by: myId}).eq('id', id);
    if(error){ showToast('No se pudo reportar: '+error.message, true); return; }
    await loadRetos(); render(); showToast('Resultado reportado, esperando confirmación del rival');
    return;
  }
  if(r.reported_by===myId){ showToast('Ya reportaste este resultado, espera a que confirme tu rival'); return; }
  if(r.reported_winner_id===winnerId){
    const { error } = await sb.from('retos').update({status:'completado', final_winner_id: winnerId}).eq('id', id);
    if(error){ showToast('No se pudo confirmar: '+error.message, true); return; }
    await loadRetos(); render(); showToast('Resultado confirmado');
  } else {
    const { error } = await sb.from('retos').update({status:'en_disputa'}).eq('id', id);
    if(error){ showToast('No se pudo actualizar: '+error.message, true); return; }
    await loadRetos(); render(); showToast('Los resultados no coinciden, un admin lo va a resolver', true);
  }
}
/* Panel de administrador para resolver disputas de retos */
function renderRetosAdmin(c){
  const disputados = (state.retos||[]).filter(r=>r.status==='en_disputa');
  const historial = (state.retos||[]).filter(r=>r.status!=='en_disputa').slice(0,30);
  c.innerHTML = `
    <div class="section-head"><h2>Retos</h2></div><div class="section-underline"></div>
    ${disputados.length>0 ? `<div class="s-name" style="margin-bottom:8px;">⚠️ Disputas por resolver (${disputados.length})</div>` +
      disputados.map(r=>{
        const chall = state.students.find(x=>x.id===r.challenger_id);
        const opp = state.students.find(x=>x.id===r.opponent_id);
        return `<div class="card">
          <div class="s-name">${chall?chall.name:'?'} vs. ${opp?opp.name:'?'}</div>
          <div class="s-meta" style="margin:4px 0 10px;">${slotLabel(r.time_slot)}</div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm btn-primary" style="flex:1;" onclick="resolverDisputaAdmin('${r.id}','${r.challenger_id}')">Ganó ${chall?chall.name:'reto A'}</button>
            <button class="btn btn-sm btn-primary" style="flex:1;" onclick="resolverDisputaAdmin('${r.id}','${r.opponent_id}')">Ganó ${opp?opp.name:'reto B'}</button>
          </div>
        </div>`;
      }).join('') : '<div class="s-meta" style="margin-bottom:14px;">Sin disputas pendientes</div>'}
    <div class="s-name" style="margin:16px 0 8px;">Historial reciente</div>
    ${historial.length===0?emptyBlock('Sin retos aún','Cuando los alumnos empiecen a retarse, aparecerán aquí'):historial.map(r=>{
      const chall = state.students.find(x=>x.id===r.challenger_id);
      const opp = state.students.find(x=>x.id===r.opponent_id);
      const statusTxt = {pendiente:'Pendiente de aceptar', abierto:'Reto abierto', aceptado:'Programado', por_confirmar:'Esperando confirmación', completado:'Completado', rechazado:'Rechazado', cancelado:'Cancelado'}[r.status]||r.status;
      return `<div class="card"><div class="s-name">${chall?chall.name:'?'} vs. ${opp?opp.name:'—'}</div>
        <div class="s-meta">${slotLabel(r.time_slot)} · ${statusTxt}${r.final_winner_id?' · Ganó '+(r.final_winner_id===r.challenger_id?(chall?chall.name:''):(opp?opp.name:'')):''}</div></div>`;
    }).join('')}
  `;
}
async function resolverDisputaAdmin(id, winnerId){
  const { error } = await sb.from('retos').update({status:'completado', final_winner_id: winnerId, admin_note:'Resuelto por admin'}).eq('id', id);
  if(error){ showToast('No se pudo resolver: '+error.message, true); return; }
  await loadRetos(); render(); showToast('Disputa resuelta');
}

/* Refresca los datos relevantes según en dónde esté parado el usuario, sin recargar
   toda la app. Se usa tanto con el botón manual como al volver de segundo plano. */
let _lastAutoRefresh = 0;
async function refreshCurrentView(silent){
  const now = Date.now();
  if(now - _lastAutoRefresh < 1500) return; // evita refrescos duplicados casi simultáneos
  _lastAutoRefresh = now;
  if(state.auth==='admin'){
    const [s,a,po,co] = await Promise.all([safeGet('students'), safeGet('attendance'), safeGet('posts'), safeGet('comments')]);
    if(s) state.students=s; if(a) state.attendance=a; if(po) state.posts=po; if(co) state.comments=co;
    await loadRetos();
    await reloadPrivateData();
    render();
    if(!silent) showToast('Datos actualizados');
  } else if(state.auth==='student'){
    const [a,s] = await Promise.all([safeGet('attendance'), safeGet('students')]);
    if(a) state.attendance = a;
    if(s) state.students = s;
    if(state.tab==='retos') await loadRetos();
    if(state.tab==='perfil') await loadMiSuscripcion();
    render();
    if(!silent) showToast('Datos actualizados');
  }
}
/* En iOS/Safari, cuando la app pasa a segundo plano el navegador congela el código;
   al volver a primer plano, refrescamos automáticamente sin que el usuario tenga
   que cerrar y volver a abrir la app por completo. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state.loaded && (state.auth==='admin' || state.auth==='student')){
    refreshCurrentView(true);
  }
});
window.addEventListener('focus', ()=>{
  if(state.loaded && (state.auth==='admin' || state.auth==='student')){
    refreshCurrentView(true);
  }
});
loadAll();
